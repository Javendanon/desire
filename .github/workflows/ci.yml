# Continuous integration for Desire.
#
# Every job is fail-closed: it installs its own toolchain or fails; nothing is skipped because a
# tool is missing. The job names are the contract with merge-policy.json (D25): the merge actor
# requires one green check per policy gate name, so renaming a job here is a policy change.
#
# Triggers: `pull_request` for review, and `merge_group` so the merge queue can test the
# integrated candidate (without it the queue waits forever).

name: ci

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned to the version the repository's quality baseline was measured with.
  KIMUN_VERSION: "0.26.0"

jobs:
  frontend-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Needs the corepack bundled with Node >= 24 (`.nvmrc`): the one in Node 22.17 (0.33) cannot
      # start pnpm 12 — it looks for bin/pnpm.cjs and pnpm 12 ships bin/pnpm.mjs.
      - name: Enable corepack (pnpm version comes from package.json packageManager)
        run: |
          corepack enable
          corepack --version
          corepack pnpm --version
      - name: Install dependencies from the lockfile only
        run: corepack pnpm install --frozen-lockfile
      - name: Type and Svelte checks
        run: corepack pnpm check
      # Offline asset pipeline (D18): strict types for sources and tests, then its test suite.
      - name: Asset pipeline types
        run: corepack pnpm check:assets
      - name: Asset pipeline tests
        run: corepack pnpm test:assets
      - name: Frontend tests and test type-check
        run: |
          corepack pnpm run test:frontend
          corepack pnpm run check:tests
      # The source raster and dataset are not in the repository, so CI checks the package's
      # internal consistency and the verifier's own tests; --image/--dataset run locally.
      - name: Waterdeep reference package
        run: corepack pnpm run verify:waterdeep

  rust-fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: ./tools/ci/install-rust-toolchain.sh
      - run: cargo fmt --all --check

  rust-clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: ./tools/ci/install-rust-toolchain.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: ./tools/ci/install-rust-toolchain.sh
      # The persistence integration tests fail closed without an isolated cluster, so the harness is
      # the workspace test entry point: it starts a socket-only cluster, runs the SQL checks and
      # then the whole suite. Replacing this step with plain `cargo test` is red for every crate
      # that touches the database; `crates/persistence/tests/pipeline.rs` guards that contract.
      - name: Put the runner's PostgreSQL binaries on PATH
        run: |
          pg_bin="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$pg_bin" ] && command -v pg_config > /dev/null; then
              pg_bin="$(pg_config --bindir)"
          fi
          test -n "$pg_bin" || { echo "::error::no PostgreSQL binaries on this runner"; exit 1; }
          echo "$pg_bin" >> "$GITHUB_PATH"
          "$pg_bin/initdb" --version
      - name: Workspace tests against a disposable PostgreSQL cluster
        run: bash crates/persistence/test-postgres.sh

  wasm-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned in rust-toolchain.toml (includes wasm32 target)
        run: ./tools/ci/install-rust-toolchain.sh
      - run: cargo build -p desire-wasm --target wasm32-unknown-unknown --release --locked

  quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Anti-tamper check on the change (suppressions, disabled or deleted tests, thresholds)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          test -n "$BASE_SHA" || { echo "::error::no base SHA for this event"; exit 1; }
          python3 tools/ci/tamper_check.py "$BASE_SHA" HEAD
      - name: Tooling tests for the anti-tamper check
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'
      # The Rust DTOs under crates/core/src/contracts/ are generated from contracts/schema.json;
      # a hand-edited generated file must not reach main.
      - name: Contract generator drift and contract tests
        run: |
          python3 tools/contracts/generate.py --check
          python3 -m unittest discover -s tools/contracts/tests -p 'test_*.py'
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: ./tools/ci/install-rust-toolchain.sh
      - name: Install kimun (km)
        run: cargo install kimun --version "$KIMUN_VERSION" --locked
      - name: Quality gate
        run: |
          test -f tools/quality/gate.py || {
            echo "::error::tools/quality/gate.py is missing (delivered by D02); failing closed"
            exit 1
          }
          python3 tools/quality/gate.py --root .
