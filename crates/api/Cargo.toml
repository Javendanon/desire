[package]
# One integration target shares the database helpers; register new suites in tests/api.rs.
autotests = false
name = "desire-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
desire-core.workspace = true
desire-persistence = { path = "../persistence" }
axum.workspace = true
postgres = "0.19.12"
tokio-postgres = "0.7.18"
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
tokio = { workspace = true, features = ["sync", "time", "fs"] }
getrandom = "=0.4.3"
sha2 = "=0.11.1"
openidconnect = "=4.0.1"
# TLS for `sslmode=require` without OpenSSL: rustls and its WebPKI roots.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "=1.0.11"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "api"
path = "tests/api.rs"
