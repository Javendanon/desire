[package]
# One integration target shares the database helpers; register new suites in tests/api.rs.
autotests = false
name = "desire-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
desire-core.workspace = true
desire-persistence = { path = "../persistence" }
axum.workspace = true
postgres = "0.19.12"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "api"
path = "tests/api.rs"
