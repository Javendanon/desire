<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b151c" />
    <title>Desire · Puerto Profundo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <style>
      :root {
        --ink: #0b151c;
        --hull: #0f1d26;
        --mist: #2c3e49;
        --parchment: #efe3c8;
        --ash: #a7b2b4;
        --lantern: #e0aa4f;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--ink);
        color: var(--parchment);
        font-family: 'Alegreya Sans', system-ui, sans-serif;
        overflow: hidden;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      .title {
        position: fixed;
        left: max(28px, env(safe-area-inset-left));
        top: 22px;
        pointer-events: none;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
      }
      .title p {
        margin: 0;
        font-family: 'Alegreya Sans SC', sans-serif;
        font-size: 15px;
        letter-spacing: 0.3em;
        color: var(--lantern);
      }
      .title h1 {
        margin: 4px 0 0;
        font-family: 'IM Fell English', serif;
        font-weight: 400;
        font-size: 44px;
        line-height: 1;
      }
      #status {
        position: fixed;
        left: 28px;
        bottom: 22px;
        font-size: 15px;
        color: var(--ash);
      }
      #hud {
        position: fixed;
        right: 16px;
        top: 16px;
        margin: 0;
        padding: 10px 12px;
        border-radius: 6px;
        background: color-mix(in srgb, var(--ink) 78%, transparent);
        color: var(--parchment);
        font: 13px/1.5 ui-monospace, monospace;
        white-space: pre;
      }
      #hud[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas
      id="scene"
      aria-label="Puerto Profundo de Waterdeep en 3D: el barrio del muelle al atardecer"
    ></canvas>
    <div class="title">
      <p>Waterdeep · revisión de diorama</p>
      <h1>Puerto Profundo</h1>
    </div>
    <p id="status"></p>
    <pre id="hud" hidden aria-live="off"></pre>
    <script type="module" src="/src/lib/diorama/main.ts"></script>
  </body>
</html>
