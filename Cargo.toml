[workspace]
members = ["crates/core", "crates/api", "crates/wasm", "crates/atlas"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
desire-core = { path = "crates/core" }
axum = "=0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
wasm-bindgen = "=0.2.128"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
rayon = "=1.12.0"

[profile.release]
lto = "thin"
codegen-units = 1
