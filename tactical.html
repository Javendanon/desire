<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b151c" />
    <title>Desire · Encounter panel</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      #map {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline-offset: -4px;
        touch-action: none;
      }
      #boot-error {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <canvas
      id="map"
      tabindex="0"
      aria-label="City map in three dimensions. Drag to pan, shift-drag to orbit, wheel to zoom."
    ></canvas>
    <div id="overlay"></div>
    <p id="boot-error" role="alert"></p>
    <script type="module" src="/content/maps/waterdeep/tactical.ts"></script>
  </body>
</html>
