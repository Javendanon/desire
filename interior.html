<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141a1e" />
    <title>Desire · Mansión Cráneo de Troll</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #ece6d6;
        --muted: #a7a294;
        --panel: #191f24;
        --line: #2f3a40;
        --accent: #e0aa4f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 19rem;
        background: #10161a;
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }
      aside {
        padding: 1.25rem;
        border-left: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
        overflow-y: auto;
      }
      .eyebrow {
        margin: 0;
        font-size: 0.66rem;
        letter-spacing: 0.18em;
        color: var(--muted);
      }
      h1 {
        margin: 0.3rem 0 0;
        font-size: 1.3rem;
      }
      p {
        margin: 0;
        font-size: 0.78rem;
        line-height: 1.5;
        color: var(--muted);
      }
      .group {
        display: grid;
        gap: 0.35rem;
      }
      button {
        font: inherit;
        font-size: 0.78rem;
        color: var(--ink);
        background: #232c32;
        border: 1px solid var(--line);
        border-radius: 0.35rem;
        padding: 0.45rem 0.6rem;
        text-align: left;
        cursor: pointer;
      }
      button:hover,
      button:focus-visible,
      button[aria-pressed='true'] {
        border-color: var(--accent);
        color: var(--accent);
        outline: none;
      }
      #status {
        font-size: 0.72rem;
        font-variant-numeric: tabular-nums;
      }
      @media (max-width: 760px) {
        body {
          grid-template-columns: 1fr;
          grid-template-rows: 62vh auto;
          overflow: auto;
        }
        aside {
          border-left: 0;
          border-top: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <canvas
      id="interior"
      tabindex="0"
      aria-label="Mansión Cráneo de Troll en 3D. Arrastra para mover la vista."
    ></canvas>
    <aside>
      <header>
        <p class="eyebrow">DESIRE / WATERDEEP</p>
        <h1>Mansión Cráneo de Troll</h1>
        <p>Elige un piso y una miniatura, y haz clic en una casilla iluminada para moverla.</p>
      </header>
      <section class="group" aria-label="Pisos" id="floors"></section>
      <section class="group" aria-label="Miniaturas" id="pieces"></section>
      <p id="status" aria-live="polite">Cargando la mansión…</p>
    </aside>
    <script type="module" src="/src/design/interior-demo.ts"></script>
  </body>
</html>
